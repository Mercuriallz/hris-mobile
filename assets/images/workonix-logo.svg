<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Logo mendatar: tanda + nama.

    Jarak antara tanda dan teks setara setengah tinggi tandanya. Itu bukan
    angka acak — jarak yang lebih rapat membuat keduanya terbaca sebagai satu
    bentuk yang kacau di ukuran kecil.
  -->
  <defs>
    <linearGradient id="wxBg2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A56A7"/>
      <stop offset="1" stop-color="#0F3B7A"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,4)">
    <rect width="48" height="48" rx="12" fill="url(#wxBg2)"/>
    <path d="M12.75 15 L18 33 L24 21.75 L30 33 L35.25 15"
          stroke="#FFFFFF"
          stroke-width="4.1"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="35.25" cy="15" r="3.75" fill="#7FB3F5"/>
  </g>

  <!--
    "work" reguler, "onix" tebal.

    Bobot yang berbeda membuat nama terbaca sebagai dua bagian, dan nama yang
    punya dua bagian lebih mudah diingat daripada satu kata panjang yang
    asing.
  -->
  <text x="72" y="36"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="26"
        letter-spacing="-0.5">
    <tspan fill="#1A2027" font-weight="400">work</tspan><tspan fill="#1A56A7" font-weight="700">onix</tspan>
  </text>
</svg>
